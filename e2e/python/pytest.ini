[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    qd_only: relies on qd-only knobs/timing (skipped when QD_E2E_TARGET=aws)
    json_only: only meaningful when the SDK speaks the AWS JSON protocol
    query_only: only meaningful when the SDK speaks the legacy Query protocol
    slow: takes several seconds of wall-clock waiting
filterwarnings =
    ignore::DeprecationWarning
