apiVersion: v1
kind: Service
metadata:
  name: {{ include "qd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qd.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (ne .Values.service.type "ClusterIP") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if and .Values.service.loadBalancerSourceRanges (eq .Values.service.type "LoadBalancer") }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "qd.selectorLabels" . | nindent 4 }}
  ports:
    - name: sqs
      port: {{ .Values.service.ports.sqs }}
      targetPort: sqs
      protocol: TCP
      appProtocol: http
      {{- if and (ne .Values.service.type "ClusterIP") .Values.service.nodePorts.sqs }}
      nodePort: {{ .Values.service.nodePorts.sqs }}
      {{- end }}
    {{- if .Values.service.exposeAdmin }}
    - name: admin
      port: {{ .Values.service.ports.admin }}
      targetPort: admin
      protocol: TCP
      appProtocol: http
      {{- if and (ne .Values.service.type "ClusterIP") .Values.service.nodePorts.admin }}
      nodePort: {{ .Values.service.nodePorts.admin }}
      {{- end }}
    {{- end }}
