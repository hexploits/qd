{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qd.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: sqs
          protocol: TCP
      {{- with .Values.networkPolicy.sqsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: admin
          protocol: TCP
      {{- with .Values.networkPolicy.adminFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres
    - ports:
        - port: {{ .Values.networkPolicy.egress.postgresPort }}
          protocol: TCP
      {{- if .Values.networkPolicy.egress.postgresTo }}
      to:
        {{- toYaml .Values.networkPolicy.egress.postgresTo | nindent 8 }}
      {{- else if .Values.postgresql.cnpg.enabled }}
      to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "qd.cnpgName" . }}
      {{- end }}
  {{- end }}
---
# Scheduler and migrate pods: no SQS port; admin port (metrics/health) only for the scheduler.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qd.roleFullname" (dict "root" . "role" "workers") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "qd.roleName" (dict "root" . "role" "scheduler") }}
          - {{ include "qd.roleName" (dict "root" . "role" "migrate") }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: admin
          protocol: TCP
      {{- with .Values.networkPolicy.adminFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres
    - ports:
        - port: {{ .Values.networkPolicy.egress.postgresPort }}
          protocol: TCP
      {{- if .Values.networkPolicy.egress.postgresTo }}
      to:
        {{- toYaml .Values.networkPolicy.egress.postgresTo | nindent 8 }}
      {{- else if .Values.postgresql.cnpg.enabled }}
      to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "qd.cnpgName" . }}
      {{- end }}
  {{- end }}
{{- end }}
