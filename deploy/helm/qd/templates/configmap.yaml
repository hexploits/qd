apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qd.labels" . | nindent 4 }}
data:
  QD_BIND: {{ printf "0.0.0.0:%v" .Values.containerPorts.sqs | quote }}
  QD_ADMIN_BIND: {{ printf "0.0.0.0:%v" .Values.containerPorts.admin | quote }}
  QD_REGION: {{ .Values.config.region | quote }}
  QD_DEFAULT_ACCOUNT_ID: {{ .Values.config.defaultAccountId | quote }}
  {{- with .Values.config.publicUrl }}
  QD_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  QD_AUTH_MODE: {{ .Values.auth.mode | quote }}
  QD_ALLOW_CROSS_ACCOUNT: {{ .Values.config.allowCrossAccount | quote }}
  QD_DB_MAX_CONNECTIONS: {{ .Values.config.db.maxConnections | quote }}
  QD_DB_MIN_CONNECTIONS: {{ .Values.config.db.minConnections | quote }}
  QD_DB_ACQUIRE_TIMEOUT_SECS: {{ .Values.config.db.acquireTimeoutSecs | quote }}
  QD_DB_STATEMENT_TIMEOUT_MS: {{ .Values.config.db.statementTimeoutMs | int64 | quote }}
  QD_QUEUE_CACHE_TTL_MS: {{ .Values.config.queueCacheTtlMs | int64 | quote }}
  QD_PURGE_COOLDOWN_SECS: {{ .Values.config.purgeCooldownSecs | quote }}
  QD_JANITOR_INTERVAL_SECS: {{ .Values.config.janitorIntervalSecs | quote }}
  QD_QUEUE_METRICS_INTERVAL_SECS: {{ .Values.config.queueMetricsIntervalSecs | quote }}
  QD_SHUTDOWN_GRACE_SECS: {{ .Values.config.shutdownGraceSecs | quote }}
  QD_MAX_BODY_BYTES: {{ .Values.config.maxBodyBytes | int64 | quote }}
  QD_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  QD_LOG: {{ .Values.config.logLevel | quote }}
  {{- with .Values.metrics.pushgateway }}
  {{- if .url }}
  QD_METRICS_PUSHGATEWAY_URL: {{ .url | quote }}
  QD_METRICS_PUSH_INTERVAL_SECS: {{ .intervalSecs | quote }}
  QD_METRICS_PUSH_JOB: {{ .job | quote }}
  {{- with .instance }}
  QD_METRICS_INSTANCE: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and .Values.metrics.dogstatsd.enabled .Values.metrics.dogstatsd.prefix }}
  QD_METRICS_DOGSTATSD_PREFIX: {{ .Values.metrics.dogstatsd.prefix | quote }}
  {{- end }}
