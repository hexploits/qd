{{- if include "qd.createDatabaseSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qd.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qd.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.url | quote }}
{{- end }}
{{- if and .Values.auth.credentials (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qd.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qd.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials: |
    # ACCESS_KEY_ID:SECRET[:ACCOUNT_ID] -- managed by Helm
    {{- range .Values.auth.credentials }}
    {{- if or (not .accessKeyId) (not .secretAccessKey) }}
    {{- fail "auth.credentials entries need accessKeyId and secretAccessKey" }}
    {{- end }}
    {{ .accessKeyId }}:{{ .secretAccessKey }}{{ with .accountId }}:{{ . }}{{ end }}
    {{- end }}
{{- end }}
